name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
        exclude:
          # keep the matrix lean: windows covers the native-ops surface
          - os: windows-latest
            python: "3.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[adapters,tris,dev]'
      # the face tests exercise the real surfaces against the canonical
      # fixtures (same layout the benchmark legs use)
      - name: Load canonical fixtures
        run: git clone --depth 1 https://github.com/serialbench/fixtures.git fixtures
        shell: bash
      - run: pytest tests/ -q
